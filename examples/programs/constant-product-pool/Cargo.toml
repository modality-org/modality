[package]
name = "constant-product-pool"
version = "0.1.0"
edition = "2021"
description = "A two-asset constant-product pool as a Modality program (raw host ABI)"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
