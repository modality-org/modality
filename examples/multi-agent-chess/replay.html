<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat vs Contract Chess</title>
<style>
  :root {
    --bg: #f6f5f1;
    --panel: #ffffff;
    --ink: #1d1d1b;
    --muted: #6b6a64;
    --line: #e2e0d8;
    --light-sq: #ece6d6;
    --dark-sq: #a8987a;
    --played: rgba(70, 130, 220, 0.45);
    --plan: #2f8f5b;
    --refused: #b3402f;
    --refused-bg: #f7e4e0;
    --late: #8a6d1f;
    --late-bg: #f5ecd2;
    --ok: #2f8f5b;
    --ok-bg: #e0f1e6;
    --off: #c4531f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614;
      --panel: #201f1c;
      --ink: #ecebe6;
      --muted: #a09e95;
      --line: #34332e;
      --light-sq: #8d8572;
      --dark-sq: #5d5444;
      --played: rgba(90, 150, 240, 0.5);
      --plan: #5cc38a;
      --refused: #f08a78;
      --refused-bg: #3a1f1a;
      --late: #e3c56c;
      --late-bg: #352d16;
      --ok: #5cc38a;
      --ok-bg: #1b3325;
      --off: #f0905c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161614; --panel: #201f1c; --ink: #ecebe6; --muted: #a09e95; --line: #34332e;
    --light-sq: #8d8572; --dark-sq: #5d5444; --played: rgba(90, 150, 240, 0.5); --plan: #5cc38a;
    --refused: #f08a78; --refused-bg: #3a1f1a; --late: #e3c56c; --late-bg: #352d16;
    --ok: #5cc38a; --ok-bg: #1b3325; --off: #f0905c; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .side h2 { font-size: 14px; margin: 0 0 8px; }
  .side h2 span { color: var(--muted); font-weight: 400; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 20px; align-items: start; }
  .board {
    display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1;
    border-radius: 8px; overflow: hidden; border: 1px solid var(--line); user-select: none;
  }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; }
  .sq.l { background: var(--light-sq); }
  .sq.d { background: var(--dark-sq); }
  .sq.played::after { content: ""; position: absolute; inset: 0; background: var(--played); }
  .sq.plan::before { content: ""; position: absolute; inset: 3px; border: 3px dashed var(--plan); border-radius: 4px; z-index: 2; }
  .pc { position: relative; z-index: 1; font-size: clamp(22px, 6.4vw, 44px); line-height: 1; }
  .pc.w { color: #fbfaf6; -webkit-text-stroke: 1.2px #2a2925; }
  .pc.b { color: #1a1917; -webkit-text-stroke: 0.6px #000; }
  .coord { position: absolute; font-size: 10px; color: rgba(0,0,0,.45); }
  .coord.f { right: 3px; bottom: 1px; } .coord.r { left: 3px; top: 1px; }
  .controls { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button:hover { border-color: var(--muted); }
  input[type=range] { width: 100%; }
  .legend { color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; margin-right: 4px; border-radius: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .panel h3 { margin: 0 0 6px; font-size: 16px; }
  .row { margin: 4px 0; }
  .muted { color: var(--muted); }
  .off { color: var(--off); font-weight: 600; }
  .attempt { border-top: 1px solid var(--line); padding: 8px 0; }
  .attempt:first-of-type { border-top: 0; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 999px; margin-left: 6px; }
  .badge.played { background: var(--ok-bg); color: var(--ok); }
  .badge.refused { background: var(--refused-bg); color: var(--refused); }
  .badge.late { background: var(--late-bg); color: var(--late); }
  .detail { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); margin-top: 3px; word-break: break-word; }
  .moves { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 2px 4px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .moves a { color: var(--ink); text-decoration: none; padding: 1px 4px; border-radius: 4px; cursor: pointer; }
  .moves a.inc { color: var(--off); font-weight: 600; }
  .moves a.inc.rej { color: var(--refused); font-weight: 600; }
  .moves a.cur { background: var(--played); }
  .moves .num { color: var(--muted); padding-left: 6px; }
  .sweep { margin-bottom: 20px; }
  .sweep h2 { font-size: 15px; margin: 0 0 4px; }
  .sweep p { margin: 0 0 8px; color: var(--muted); font-size: 13px; max-width: 70ch; }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: 0; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; }
  td.zero { color: var(--ok); font-weight: 600; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .sides { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>AI chess: chat against a contract</h1>
  <p class="sub" id="sub"></p>
  <section class="sweep" id="sweep" hidden>
    <h2>Across many games</h2>
    <p id="sweepNote"></p>
    <div class="tablewrap"><table id="sweepTable"></table></div>
  </section>
  <h2 style="font-size:15px;margin:0 0 8px" id="gameTitle" hidden>One game, turn by turn</h2>
  <div class="sides" id="sides"></div>
  <div class="layout">
    <div>
      <div class="board" id="board" aria-label="Chess board"></div>
      <div class="controls">
        <button id="first" title="Start">⏮</button>
        <button id="prev" title="Previous (←)">◀</button>
        <button id="next" title="Next (→)">▶</button>
        <button id="last" title="End">⏭</button>
        <button id="nextInc" title="Next turn where an agent went off plan (n)">Next incident</button>
      </div>
      <input type="range" id="slider" min="0" value="0" aria-label="Ply">
      <div class="legend">
        <span><i style="background:var(--played)"></i>move played</span>
        <span><i style="border:2px dashed var(--plan)"></i>team plan, when not played</span>
      </div>
    </div>
    <div>
      <div class="panel" id="panel"></div>
      <div class="moves" id="moves"></div>
    </div>
  </div>
</main>
<script>
const DATA = /*GAME_DATA*/null;
const game = DATA.game, summary = DATA.summary, plies = game.plies;
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const START = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
let cur = 0;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stray = p => p.attempts.filter(a => a.kind !== "plan");
const offPlan = p => p.played.uci !== p.plan.uci;
const moveNo = p => Math.ceil(p.ply / 2) + (p.side === "white" ? "." : "...");

function parseFen(fen) {
  const rows = fen.split(" ")[0].split("/"), board = {};
  rows.forEach((row, i) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) f += +ch;
      else { board["abcdefgh"[f] + (8 - i)] = ch; f++; }
    }
  });
  return board;
}

function header() {
  const f = game.faults;
  const result = game.winner ? `${game.winner[0].toUpperCase() + game.winner.slice(1)} wins` : "Draw";
  document.getElementById("sub").textContent =
    `${result} (${game.reason}), ${plies.length} plies. Seed ${game.seed}; panic ${f.panic}, greed ${f.greed}, amnesia ${f.amnesia}` +
    (f.rogue ? `; rogue agents ${game.rogue.white} and ${game.rogue.black}` : "") + ".";
  const card = (side, title, note, extra) => {
    const s = summary[side];
    return `<div class="side"><h2>${title} <span>${note}</span></h2><div class="stats">
      <div class="stat"><b>${s.off_plan_attempts}</b><small>off-plan moves sent</small></div>
      <div class="stat"><b>${s.off_plan_played}</b><small>off-plan moves played</small></div>
      <div class="stat"><b>${s.centipawns_lost}</b><small>centipawns lost to them</small></div>
    </div>${extra}</div>`;
  };
  document.getElementById("sides").innerHTML =
    card("white", "White", "· 16 agents over chat", "") +
    card("black", "Black", "· 16 agents under a Modality contract",
      `<div class="row muted" style="margin-top:8px;font-size:13px">${game.contract.accepted} commits accepted, ${game.contract.refused} refused by <code>modal</code></div>`);
}

function drawBoard() {
  const fen = cur === 0 ? START : plies[cur - 1].fen;
  const pos = parseFen(fen);
  const p = cur > 0 ? plies[cur - 1] : null;
  const played = p ? [p.played.uci.slice(0, 2), p.played.uci.slice(2, 4)] : [];
  const plan = p && offPlan(p) ? [p.plan.uci.slice(0, 2), p.plan.uci.slice(2, 4)] : [];
  let html = "";
  for (let r = 8; r >= 1; r--) {
    for (let f = 0; f < 8; f++) {
      const sq = "abcdefgh"[f] + r, piece = pos[sq];
      const cls = ["sq", (f + r) % 2 ? "l" : "d"];
      if (played.includes(sq)) cls.push("played");
      if (plan.includes(sq)) cls.push("plan");
      html += `<div class="${cls.join(" ")}" title="${sq}">`;
      if (piece) {
        const white = piece === piece.toUpperCase();
        html += `<span class="pc ${white ? "w" : "b"}">${GLYPH[piece.toLowerCase()]}&#xFE0E;</span>`;
      }
      if (r === 1) html += `<span class="coord f">${"abcdefgh"[f]}</span>`;
      if (f === 0) html += `<span class="coord r">${r}</span>`;
      html += "</div>";
    }
  }
  document.getElementById("board").innerHTML = html;
}

function drawPanel() {
  const el = document.getElementById("panel");
  if (cur === 0) {
    el.innerHTML = `<h3>Start</h3>
      <p class="row">Every piece is an agent. Each turn the agents of the side to move agree on a plan, the best move their shared engine finds.
      Some agents go their own way: a threatened piece panics, a piece grabs a capture, or the chosen piece forgets the plan.</p>
      <p class="row"><b>White</b> coordinates over chat: the referee plays the first White move it receives.</p>
      <p class="row"><b>Black</b> coordinates through a Modality contract: a Black move counts only when four of the sixteen Black agents sign the commit, and <code>modal</code> refuses the rest.</p>
      <p class="row muted">Use ▶, the arrow keys, or “Next incident”.</p>`;
    return;
  }
  const p = plies[cur - 1];
  const side = p.side === "white" ? "White (chat)" : "Black (contract)";
  let html = `<h3>${moveNo(p)} ${esc(p.played.san)} <span class="muted" style="font-weight:400;font-size:14px">· ${side}</span></h3>`;
  html += `<div class="row">Team plan: <b>${esc(p.plan.san)}</b> by ${esc(p.plan.agent)}</div>`;
  if (offPlan(p)) {
    html += `<div class="row off">Played ${esc(p.played.san)} by ${esc(p.played.agent)} instead, costing ${p.cost} centipawns</div>`;
  } else {
    html += `<div class="row">Played as planned.</div>`;
  }
  if (p.captured) html += `<div class="row muted">Captured agent: ${esc(p.captured)}</div>`;
  const list = p.attempts.filter(a => a.kind !== "plan" || p.attempts.length > 1);
  if (list.length) {
    html += `<div style="margin-top:10px">`;
    for (const a of list) {
      const cls = a.outcome === "played" || a.outcome === "accepted" ? "played" : a.outcome === "refused" ? "refused" : "late";
      html += `<div class="attempt"><b>${esc(a.agent)}</b> <span class="muted">(${esc(a.kind)})</span> sent ${esc(a.san)}
        <span class="badge ${cls}">${esc(a.outcome)}</span>
        ${a.detail ? `<div class="detail">${esc(a.detail)}</div>` : ""}</div>`;
    }
    html += `</div>`;
  }
  el.innerHTML = html;
}

function drawMoves() {
  let html = "";
  plies.forEach((p, i) => {
    if (p.side === "white") html += `<span class="num">${Math.ceil(p.ply / 2)}.</span>`;
    const cls = [];
    if (offPlan(p)) cls.push("inc");
    else if (stray(p).length && p.side === "black") cls.push("inc", "rej");
    if (i + 1 === cur) cls.push("cur");
    html += `<a data-i="${i + 1}" class="${cls.join(" ")}">${esc(p.played.san)}</a>`;
  });
  const el = document.getElementById("moves");
  el.innerHTML = html;
  el.querySelectorAll("a").forEach(a => a.onclick = () => go(+a.dataset.i));
}

function go(i) {
  cur = Math.max(0, Math.min(plies.length, i));
  document.getElementById("slider").value = cur;
  drawBoard(); drawPanel();
  document.querySelectorAll("#moves a").forEach(a => a.classList.toggle("cur", +a.dataset.i === cur));
}

function nextIncident() {
  for (let i = cur + 1; i <= plies.length; i++) if (stray(plies[i - 1]).length) return go(i);
}

function sweep() {
  const rows = DATA.sweep;
  if (!rows) return;
  document.getElementById("sweep").hidden = false;
  document.getElementById("gameTitle").hidden = false;
  document.getElementById("sweepNote").textContent =
    `${rows[0].games} games per row. Black score counts a win as 1 and a draw as ½. ` +
    "Sent and played are off-plan moves per game: what a side's agents sent, and what the referee played.";
  const head = ["Scenario", "White wins", "Draws", "Black wins", "Black score", "White sent", "White played", "Black sent", "Black played"];
  let html = "<thead><tr>" + head.map(h => `<th>${h}</th>`).join("") + "</tr></thead><tbody>";
  for (const r of rows) {
    const cell = (v, d = 1) => `<td${v === 0 ? ' class="zero"' : ""}>${typeof v === "number" ? v.toFixed(d) : esc(v)}</td>`;
    html += `<tr><td>${esc(r.scenario)}</td><td>${r.white_wins}</td><td>${r.draws}</td><td>${r.black_wins}</td>` +
      `<td>${r.black_score.toFixed(2)}</td>` +
      cell(r.white_off_plan_attempts) + cell(r.white_off_plan_played) +
      cell(r.black_off_plan_attempts) + cell(r.black_off_plan_played) + "</tr>";
  }
  document.getElementById("sweepTable").innerHTML = html + "</tbody>";
}

sweep(); header(); drawMoves();
const slider = document.getElementById("slider");
slider.max = plies.length;
slider.oninput = () => go(+slider.value);
document.getElementById("first").onclick = () => go(0);
document.getElementById("prev").onclick = () => go(cur - 1);
document.getElementById("next").onclick = () => go(cur + 1);
document.getElementById("last").onclick = () => go(plies.length);
document.getElementById("nextInc").onclick = nextIncident;
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") go(cur - 1);
  else if (e.key === "ArrowRight") go(cur + 1);
  else if (e.key === "n") nextIncident();
});
go(0);
</script>
</body>
</html>
