[package]
name = "mod-emission"
version = "0.1.0"
edition = "2021"
description = "The MOD contract's emission schedule as a Modality program (raw host ABI)"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
