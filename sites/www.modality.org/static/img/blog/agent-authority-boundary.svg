<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">The boundary between an agent's choice and its authority</title>
  <desc id="desc">An agent proposes an action. A verifiable agreement checks the proposal against signatures, state, and rules. A valid commit is accepted and recorded; an invalid commit is rejected without changing the contract history.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#a8b7d8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="618" rx="22" fill="#111827" stroke="#31405b" stroke-width="2"/>
  <text x="42" y="47" fill="#8eabff" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" letter-spacing="2">01 / ENFORCEMENT BOUNDARY</text>
  <text x="42" y="88" fill="#f6f8ff" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="750">Intelligence chooses. Rules authorize.</text>
  <path d="M380 203 V248" fill="none" stroke="#a8b7d8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M380 377 V410 H198 V439" fill="none" stroke="#a8b7d8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M380 410 H562 V439" fill="none" stroke="#a8b7d8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="70" y="125" width="620" height="78" rx="14" fill="#24365e" stroke="#6d90ef" stroke-width="2"/>
  <text x="101" y="159" fill="#f6f8ff" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="700">Agent proposes an action</text>
  <text x="101" y="184" fill="#c7d6fc" font-family="Inter,system-ui,sans-serif" font-size="17">A choice, not yet an authorized change</text>
  <rect x="70" y="254" width="620" height="123" rx="14" fill="#1c2946" stroke="#98aaff" stroke-width="2"/>
  <text x="101" y="293" fill="#f6f8ff" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="700">Verifiable agreement</text>
  <text x="101" y="326" fill="#c7d6fc" font-family="Inter,system-ui,sans-serif" font-size="18">Checks signatures, current state, and accumulated rules</text>
  <text x="101" y="351" fill="#c7d6fc" font-family="Inter,system-ui,sans-serif" font-size="18">at the enforcement point</text>
  <rect x="45" y="445" width="306" height="103" rx="14" fill="#183c3c" stroke="#5bd0ac" stroke-width="2"/>
  <text x="72" y="481" fill="#94f3cc" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="750">ACCEPT</text>
  <text x="72" y="513" fill="#e3fff3" font-family="Inter,system-ui,sans-serif" font-size="18">Record the valid commit</text>
  <rect x="409" y="445" width="306" height="103" rx="14" fill="#452734" stroke="#ee91a9" stroke-width="2"/>
  <text x="436" y="481" fill="#ffc0ce" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="750">REJECT</text>
  <text x="436" y="513" fill="#ffe3e9" font-family="Inter,system-ui,sans-serif" font-size="18">No contract state change</text>
  <text x="380" y="587" text-anchor="middle" fill="#aebbd3" font-family="Inter,system-ui,sans-serif" font-size="17">The boundary works only for actions routed through it.</text>
</svg>
