<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
  <title id="title">Two participants independently verify the same agreement</title>
  <desc id="desc">A shared model, accumulated rules, and signed commit history are available to both participants. Each independently replays the history and checks the same accepted state instead of trusting the other's internal system.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#a8b7d8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="608" rx="22" fill="#111827" stroke="#31405b" stroke-width="2"/>
  <text x="42" y="47" fill="#8eabff" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" letter-spacing="2">02 / INDEPENDENT VERIFICATION</text>
  <text x="42" y="88" fill="#f6f8ff" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="750">One agreement. Two independent checks.</text>
  <path d="M380 246 V274 H195 V304" fill="none" stroke="#a8b7d8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M380 274 H565 V304" fill="none" stroke="#a8b7d8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="97" y="129" width="566" height="117" rx="14" fill="#24365e" stroke="#6d90ef" stroke-width="2"/>
  <text x="127" y="167" fill="#f6f8ff" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="700">Shared contract and signed history</text>
  <text x="127" y="201" fill="#c7d6fc" font-family="Inter,system-ui,sans-serif" font-size="18">Model · accumulated rules · accepted commits</text>
  <rect x="38" y="309" width="315" height="159" rx="14" fill="#1b3547" stroke="#64c4e4" stroke-width="2"/>
  <text x="68" y="349" fill="#a3e9ff" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="750">PARTICIPANT A</text>
  <text x="68" y="384" fill="#effbff" font-family="Inter,system-ui,sans-serif" font-size="18">Replays commits locally</text>
  <text x="68" y="415" fill="#effbff" font-family="Inter,system-ui,sans-serif" font-size="18">Checks rules and signatures</text>
  <text x="68" y="446" fill="#a3e9ff" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700">Computes accepted state</text>
  <rect x="407" y="309" width="315" height="159" rx="14" fill="#322d4b" stroke="#b9a1f8" stroke-width="2"/>
  <text x="437" y="349" fill="#d8caff" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="750">PARTICIPANT B</text>
  <text x="437" y="384" fill="#f7f2ff" font-family="Inter,system-ui,sans-serif" font-size="18">Replays commits locally</text>
  <text x="437" y="415" fill="#f7f2ff" font-family="Inter,system-ui,sans-serif" font-size="18">Checks rules and signatures</text>
  <text x="437" y="446" fill="#d8caff" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700">Computes accepted state</text>
  <text x="380" y="530" text-anchor="middle" fill="#e8eeff" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700">Neither party must trust the other's runtime.</text>
  <text x="380" y="562" text-anchor="middle" fill="#aebbd3" font-family="Inter,system-ui,sans-serif" font-size="17">The guarantee depends on the same inputs and validation rules.</text>
</svg>
