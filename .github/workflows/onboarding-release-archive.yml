name: Onboarding Release Archive

on:
  workflow_dispatch:
  push:
    tags:
      - 'modal-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  RUSTFLAGS: "-D warnings"

jobs:
  linux-x86-64:
    name: Linux x86_64 lean modal archive
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: rust/target
          key: ${{ runner.os }}-onboarding-release-archive-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-onboarding-release-archive-

      - name: Install system dependencies
        timeout-minutes: 40
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          grep -ril 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo sed -i 's/^\([^#].*\)$/# disabled for CI: \1/'
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y cmake clang libssl-dev pkg-config

      - name: Verify pinned Rust dependency graph
        working-directory: rust
        run: |
          rustup show active-toolchain
          cargo metadata --locked --no-deps --format-version 1

      - name: Capture source revision
        id: source-revision
        run: |
          short_rev="$(git rev-parse --short HEAD)"
          echo "MODAL_SOURCE_REV=$short_rev" >> "$GITHUB_ENV"
          echo "short=$short_rev" >> "$GITHUB_OUTPUT"

      - name: Build language CLI
        working-directory: rust
        run: cargo build --release --locked -p modality

      - name: Build lean onboarding modal
        working-directory: rust
        env:
          MODAL_GIT_BRANCH: ${{ github.ref_name }}
          MODAL_GIT_COMMIT: ${{ steps.source-revision.outputs.short }}
        run: cargo build --release --locked -p modal --no-default-features --features contract-onboarding

      - name: Create and verify replayable archive bundle
        env:
          MODAL_BIN: rust/target/release/modal
          MODALITY_BIN: rust/target/release/modality
          MODAL_ONBOARDING_PROFILE: release
          MODAL_ONBOARDING_ARCHIVE_DIR: release-archive
          MODAL_ONBOARDING_ARCHIVE_EXPECT_REV: ${{ steps.source-revision.outputs.short }}
        run: tests/cli/check-modal-release-archive-readiness.sh

      - name: Upload archive bundle
        id: upload-archive
        uses: actions/upload-artifact@v5
        with:
          name: modal-linux-x86_64-release-archive-${{ steps.source-revision.outputs.short }}
          path: release-archive/*
          if-no-files-found: error

      - name: Archive summary
        run: |
          artifact_name="modal-linux-x86_64-release-archive-${MODAL_SOURCE_REV}"
          shopt -s nullglob
          archive_sidecars=(release-archive/modal-*.tar.gz.sha256)
          shopt -u nullglob
          if [ "${#archive_sidecars[@]}" -ne 1 ]; then
            printf 'expected exactly one archive checksum sidecar, found %s\n' "${#archive_sidecars[@]}" >&2
            exit 1
          fi
          checksum_line="$(cat "${archive_sidecars[0]}")"
          upload_digest="${{ steps.upload-archive.outputs['artifact-digest'] || steps.upload-archive.outputs.digest }}"
          if [ -z "$upload_digest" ]; then
            echo "expected upload-artifact to report a GitHub artifact digest" >&2
            exit 1
          fi
          echo "## Onboarding release archive" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source revision: \`${MODAL_SOURCE_REV}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Profile: \`release\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Feature set: \`contract-onboarding\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Actions artifact: \`${artifact_name}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub artifact digest: \`${upload_digest}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Detached tarball checksum: \`${checksum_line}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evidence: detached tarball checksum, download verification recipe, exact archive members, checksums, provenance, binary version, recorded help surface, first-contract smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download: \`gh run download ${GITHUB_RUN_ID} --name ${artifact_name} --dir /path/to/downloaded-artifact-dir\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verify: \`MODAL_ONBOARDING_ARTIFACT_EXPECT_REV=${MODAL_SOURCE_REV} tests/cli/check-modal-release-artifact-download.sh /path/to/downloaded-artifact-dir\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke replay: \`MODAL_ONBOARDING_ARTIFACT_SMOKE=1 MODAL_ONBOARDING_ARTIFACT_EXPECT_REV=${MODAL_SOURCE_REV} MODALITY_BIN=/path/to/modality tests/cli/check-modal-release-artifact-download.sh /path/to/downloaded-artifact-dir\` checks the unpacked binary version, recorded help surface, same-revision modality binary, and first-contract path" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Local replay" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_dir=/tmp/modal-release-${MODAL_SOURCE_REV}" >> "$GITHUB_STEP_SUMMARY"
          echo 'mkdir -p "$artifact_dir"' >> "$GITHUB_STEP_SUMMARY"
          echo "gh run download ${GITHUB_RUN_ID} --name ${artifact_name} --dir \"\$artifact_dir\"" >> "$GITHUB_STEP_SUMMARY"
          echo "MODAL_ONBOARDING_ARTIFACT_EXPECT_REV=${MODAL_SOURCE_REV} tests/cli/check-modal-release-artifact-download.sh \"\$artifact_dir\"" >> "$GITHUB_STEP_SUMMARY"
          echo "# Optional: replay the downloaded binary through version, help-surface, same-revision modality, and first-contract smokes." >> "$GITHUB_STEP_SUMMARY"
          echo "MODAL_ONBOARDING_ARTIFACT_SMOKE=1 MODAL_ONBOARDING_ARTIFACT_EXPECT_REV=${MODAL_SOURCE_REV} MODALITY_BIN=/path/to/modality tests/cli/check-modal-release-artifact-download.sh \"\$artifact_dir\"" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          find release-archive -maxdepth 1 -type f -printf '- `%f`\n' >> "$GITHUB_STEP_SUMMARY"
