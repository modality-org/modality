[package]
name = "modality-rule-suite"
version = "0.1.0"
edition = "2021"
description = "Graded suite of contracts and plain-language rule requests for AI-written Modality rules"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"

[dependencies]
modality-common = { path = "../modality-common", version = "0.1.7", features = ["model-governance"] }
modality-lang = { path = "../modality-lang", version = "0.1.7" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
