[package]
name = "modality-validator"
version = "0.1.0"
edition = "2021"
description = "Contract replay and prefix-cert validation for Modality validators"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"
documentation = "https://docs.rs/modality"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
modality-datastore = { path = "../modality-datastore", version = "0.1.0" }
modality-wasm-runtime = { path = "../modality-wasm-runtime", version = "0.1.0" }
modality-wasm-validation = { path = "../modality-wasm-validation", version = "0.1.0" }
modality-lang = { path = "../modality-lang", version = "0.1.7" }
modality-common = { path = "../modality-common", version = "0.1.7", features = ["model-governance"] }
# Pinned: fuel counts are part of consensus (gas schedule v1).
wasmtime = "=26.0.1"
libp2p-identity = { version = "0.2.12", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }
env_logger = "0.11"
tempfile = "3.5"
wat = "1"
