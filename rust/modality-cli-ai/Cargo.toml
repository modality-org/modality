[package]
name = "modal-cli-ai"
version = "0.1.0"
edition = "2021"
description = "AI provider configuration and rule suggestion for Modal CLI"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"

[dependencies]
modal-common = { path = "../modal-common", version = "0.1.7" }
modality-lang = { path = "../modality-lang", version = "0.1.7" }
anyhow = "1.0"
clap = { version = "4.1.11", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
aws-credential-types = "1.2"
aws-sigv4 = "1.2"
aws-smithy-runtime-api = "1.7"
percent-encoding = "2.3"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros"] }
