[package]
name = "modal-cli-predicate"
version = "0.1.0"
edition = "2021"
description = "Predicate management commands for Modal CLI"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"

[dependencies]
modal-cli-common = { path = "../modal-cli-common", version = "0.1.0" }
anyhow = "1.0"
clap = { version = "4.1.11", features = ["derive"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
