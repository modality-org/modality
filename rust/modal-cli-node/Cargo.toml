[package]
name = "modal-cli-node"
version = "0.1.0"
edition = "2021"
description = "Node management commands for Modal CLI"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"

[dependencies]
modal-cli-common = { path = "../modal-cli-common", version = "0.1.0" }
modal-common = { path = "../modal-common", version = "0.1.7" }
modal-node = { path = "../modal-node", version = "0.1.7" }
modal-datastore = { path = "../modal-datastore", version = "0.1.0" }
modal-networks = { path = "../modal-networks", version = "0.1.0" }
anyhow = "1.0"
clap = { version = "4.1.11", features = ["derive", "env"] }
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros", "time", "fs", "process", "signal"] }
tokio-util = { version = "0.7", features = ["full"] }
serde = "1.0"
serde_json = "1.0"
colored = "2.1"
dirs = "5.0"
log = "0.4"
ctrlc = "3.4"
chrono = "0.4"
rand = "0.8"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
tempfile = "3.10"
