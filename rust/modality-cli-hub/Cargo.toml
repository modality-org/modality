[package]
name = "modal-cli-hub"
version = "0.1.0"
edition = "2021"
description = "Contract hub server commands for Modal CLI"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"

[dependencies]
modal-cli-common = { path = "../modal-cli-common", version = "0.1.0" }
modal-common = { path = "../modal-common", version = "0.1.7" }
modality-lang = { path = "../modality-lang", version = "0.1.7" }
modal-rpc = { path = "../modal-rpc", version = "0.1.0" }
anyhow = "1.0"
tracing = "0.1"
clap = { version = "4.1.11", features = ["derive"] }
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros", "time", "fs", "signal"] }
async-trait = "0.1.68"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
thiserror = "1.0"
rand = "0.8"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.42.0", features = ["full", "test-util"] }
tower = { version = "0.4", features = ["util"] }
