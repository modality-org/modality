[package]
name = "modality-cli-chain"
version = "0.1.0"
edition = "2021"
description = "Chain validation commands for Modal CLI"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"

[dependencies]
modality-cli-common = { path = "../modality-cli-common", version = "0.1.0" }
modality-datastore = { path = "../modality-datastore", version = "0.1.0" }
modality-miner = { path = "../modality-miner", version = "0.1.0" }
modality-observer = { path = "../modality-observer", version = "0.1.0" }
anyhow = "1.0"
clap = { version = "4.1.11", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros", "time"] }
