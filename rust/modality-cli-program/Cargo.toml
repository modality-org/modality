[package]
name = "modality-cli-program"
version = "0.1.0"
edition = "2021"
description = "Program management commands for Modal CLI"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"

[features]
default = []
wasm = ["dep:modality-wasm-runtime"]
full = ["wasm"]

[dependencies]
modality-cli-common = { path = "../modality-cli-common", version = "0.1.0" }
modality-common = { path = "../modality-common", version = "0.1.7" }
modality-wasm-runtime = { path = "../modality-wasm-runtime", version = "0.1.0", optional = true }
anyhow = "1.0"
clap = { version = "4.1.11", features = ["derive"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
