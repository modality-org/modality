[package]
name = "modality-sequencer"
version = "0.1.0"
edition = "2021"
description = "Shoal sequencer for Modality - orders contract bytes on the sequencer DAG"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"
documentation = "https://docs.rs/modality"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
modality-datastore = { path = "../modality-datastore", version = "0.1.0" }
modality-sequencer-consensus = { path = "../modality-sequencer-consensus", version = "0.1.0" }
modality-validator = { path = "../modality-validator", version = "0.1.0" }
libp2p-identity = { version = "0.2.12", features = ["serde"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }
env_logger = "0.11"
tempfile = "3.5"

[features]
default = []
persistence = ["modality-sequencer-consensus/persistence"]
