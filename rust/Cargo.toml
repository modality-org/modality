[workspace]
resolver = "2"

members = [
  'modality-validator-consensus'
, 'modality-datastore'
, 'modality-devnet'
, 'modality-miner'
, 'modality-node'
, 'modality-observer'
, 'modality-validator'
, "modality-common"
, "modality"
, "modality-lang"
, "modality-synthesizer"
, "modality-lsp"
, "modality-rpc"
, "modal"
, "modality-networks"
, "modality-wasm-runtime"
, "modality-wasm-validation"
,   "modality-cli-common"
, "modality-cli-hub"
, "modality-cli-node"
, "modality-cli-contract"
, "modality-cli-ai"
, "modality-cli-predicate"
, "modality-cli-program"
, "modality-cli-chain"
, "modality-cli-net"]

default-members = [
  "modality",
  "modality-lang",
  "modality-lsp",
]

[profile.release]
strip = true
lto = true

# Testnet packages. Same settings as release, without fat link-time optimization.
[profile.quick_release]
inherits = "release"
lto = false
