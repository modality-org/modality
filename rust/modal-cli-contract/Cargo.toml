[package]
name = "modal-cli-contract"
version = "0.1.0"
edition = "2021"
description = "Contract management commands for Modal CLI"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"

[dependencies]
modal-cli-common = { path = "../modal-cli-common", version = "0.1.0" }
modal-common = { path = "../modal-common", version = "0.1.7" }
modality-lang = { path = "../modality-lang", version = "0.1.7" }
modal-node = { path = "../modal-node", version = "0.1.7" }
modal-datastore = { path = "../modal-datastore", version = "0.1.0" }
modal-wasm-runtime = { path = "../modal-wasm-runtime", version = "0.1.0" }
anyhow = "1.0"
clap = { version = "4.1.11", features = ["derive", "env"] }
tokio = { version = "1.42.0", features = ["full"] }
serde = "1.0"
serde_json = "1.0"
colored = "2.1"
walkdir = "2.5"
zip = "2.1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rpassword = "7.3"
dirs = "5.0"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tempfile = "3.10"
