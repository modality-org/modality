[package]
name = "modal-cli-contract"
version = "0.1.0"
edition = "2021"
description = "Contract management commands for Modal CLI"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"

[features]
default = []
p2p = ["dep:modal-node"]
model-status = ["dep:modality-lang"]
wasm = ["dep:modal-wasm-runtime"]
full = ["p2p", "model-status", "wasm"]

[dependencies]
modal-cli-common = { path = "../modal-cli-common", version = "0.1.0" }
modal-common = { path = "../modal-common", version = "0.1.7" }
modality-lang = { path = "../modality-lang", version = "0.1.7", optional = true }
modal-node = { path = "../modal-node", version = "0.1.7", optional = true }
modal-wasm-runtime = { path = "../modal-wasm-runtime", version = "0.1.0", optional = true }
anyhow = "1.0"
clap = { version = "4.1.11", features = ["derive", "env"] }
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros"] }
serde = "1.0"
serde_json = "1.0"
colored = "2.1"
walkdir = "2.5"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rpassword = "7.3"
dirs = "5.0"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tempfile = "3.10"
