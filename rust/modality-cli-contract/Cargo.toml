[package]
name = "modality-cli-contract"
version = "0.1.0"
edition = "2021"
description = "Contract management commands for Modal CLI"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"

[features]
default = []
p2p = ["dep:modality-node"]
model-status = ["modality-common/model-governance"]
wasm = ["dep:modality-wasm-runtime", "dep:modality-wasm-validation"]
full = ["p2p", "model-status", "wasm"]

[dependencies]
modality-cli-common = { path = "../modality-cli-common", version = "0.1.0" }
modality-cli-ai = { path = "../modality-cli-ai", version = "0.1.0" }
modality-common = { path = "../modality-common", version = "0.1.7" }
modality-node = { path = "../modality-node", version = "0.1.7", optional = true }
modality-wasm-runtime = { path = "../modality-wasm-runtime", version = "0.1.0", optional = true }
modality-wasm-validation = { path = "../modality-wasm-validation", version = "0.1.0", optional = true }
anyhow = "1.0"
clap = { version = "4.1.11", features = ["derive", "env"] }
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros"] }
serde = "1.0"
serde_json = "1.0"
colored = "2.1"
walkdir = "2.5"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rpassword = "7.3"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tempfile = "3.10"
