[package]
name = "modality-node"
version = "0.1.7"
edition = "2021"
description = "Modality network node lib"
license = "MIT"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"
documentation = "https://docs.rs/modality"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
clap = { version = "4.1.11", features = ["cargo", "derive", "env"] }
env_logger = "0.10.0"
futures = "0.3.27"
futures-timer = "3.0.2"
libp2p = { version = "0.56", features = [
  "identify",
  "ping",
  "tokio",
  "gossipsub",
  "macros",
  "relay",
  "kad",
  "rsa",
  "ed25519",
  "quic",
  "request-response",
  "dns",
  "tcp",
  "memory-connection-limits",
  "noise",
  "yamux",
  "plaintext",
  "tls",
  "websocket",
  "json",
  "mdns",
] }
libp2p-identity = { version = "0.2.12", features = ["ed25519", "peerid"] }
log = "0.4.17"
rand = "0.8.5"
tokio = { version = "1.27.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
async-trait = "0.1.68"
serde = "1.0.200"
serde_json = "1.0.116"
base64 = "0.22.1"
zeroize = "1.7.0"
ctrlc = "3.4.5"
sha2 = "0.10"
# libp2p-stream = "0.1.0-alpha"
modality-common = { path = "../modality-common", version = "0.1.6" }
modality-validator = { path = "../modality-validator", version = "0.1.0" }
modality-validator-consensus = { path = "../modality-validator-consensus", version = "0.1.0" }
modality-datastore = { path = "../modality-datastore", version = "0.1.0" }
modality-miner = { path = "../modality-miner", version = "0.1.0", features = ["persistence"] }
modality-observer = { path = "../modality-observer", version = "0.1.0" }
modality-networks = { path = "../modality-networks", version = "0.1.0" }
self-replace = "1.3"
which = "6.0"
reqwest = { version = "0.11", features = ["json"] }
warp = "0.3"

[dev-dependencies]
tempfile = "3.5"