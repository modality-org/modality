<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <script src="{{MERMAID_JS}}"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
      line-height: 1.4;
    }
    header { margin-bottom: 20px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    h2 { font-size: 1rem; margin: 0 0 12px; font-weight: 600; }
    .path { opacity: 0.7; font-size: 0.9rem; }
    .layout {
      display: grid;
      gap: 20px;
    }
    @media (min-width: 960px) {
      .layout { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
    }
    .panel {
      min-width: 0;
    }
    .diagram, .code {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      overflow: auto;
    }
    .code {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre;
    }
    .error {
      color: #b00020;
      white-space: pre-wrap;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      .diagram, .code { background: #1b1b1b; }
    }
  </style>
</head>
<body>
  <header>
    <h1>{{TITLE}}</h1>
    <div class="path">{{SOURCE_PATH}}</div>
  </header>
  <div class="layout">
    <section class="panel">
      <h2>Diagram</h2>
      <pre id="source" hidden>{{MERMAID}}</pre>
      <div class="diagram" id="diagram"></div>
    </section>
    <section class="panel">
      <h2>Modality</h2>
      <pre class="code"><code>{{MODALITY}}</code></pre>
    </section>
  </div>
  <script>
    const source = document.getElementById('source').textContent;
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({
      startOnLoad: false,
      theme: dark ? 'dark' : 'neutral',
      securityLevel: 'strict'
    });
    mermaid.render('modality-view', source).then(({ svg }) => {
      document.getElementById('diagram').innerHTML = svg;
    }).catch((err) => {
      const el = document.createElement('div');
      el.className = 'error';
      el.textContent = err && err.message ? err.message : String(err);
      document.getElementById('diagram').appendChild(el);
    });
  </script>
</body>
</html>
