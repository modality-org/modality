[package]
name = "modality"
version = "0.1.7"
edition = "2021"
description = "CLI for Modality, an evolving temporal modal logic"
license = "MIT"
documentation = "https://docs.rs/modality"
repository = "https://github.com/modality-org/modality"
homepage = "https://www.modality.org"
readme = "../README.md"

[lib]
name = "modality"
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
modality-lang = { path = "../modality-lang", version = "0.1.7" }
modality-synthesizer = { path = "../modality-synthesizer", version = "0.1.7" }
anyhow = "1.0"
clap = { version = "4.1.11", features = ["cargo", "derive", "env"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "io-util", "time"] }
serde_json = "1.0.116"

modality-common = { path = "../modality-common", version = "0.1.7", optional = true }
modality-node = { path = "../modality-node", optional = true }
modality-datastore = { path = "../modality-datastore", optional = true }
libp2p = { version = "0.56", optional = true }
log = { version = "0.4.17", optional = true }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false, optional = true }
rpassword = { version = "7.0", optional = true }
self-replace = { version = "1.3", optional = true }
serde = { version = "1.0.200", features = ["derive"], optional = true }

modality-cli-contract = { path = "../modality-cli-contract", version = "0.1.0", optional = true }
modality-cli-ai = { path = "../modality-cli-ai", version = "0.1.0", optional = true }
modality-cli-node = { path = "../modality-cli-node", version = "0.1.0", optional = true }
modality-cli-hub = { path = "../modality-cli-hub", version = "0.1.0", optional = true }
modality-cli-predicate = { path = "../modality-cli-predicate", version = "0.1.0", optional = true }
modality-cli-program = { path = "../modality-cli-program", version = "0.1.0", optional = true }
modality-cli-chain = { path = "../modality-cli-chain", version = "0.1.0", optional = true }
modality-cli-net = { path = "../modality-cli-net", version = "0.1.0", optional = true }

[dev-dependencies]
tempfile = "3.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

[features]
default = []
contract = ["dep:modality-common"]
identity = ["dep:modality-common", "dep:rpassword"]
node = ["dep:libp2p", "dep:log", "dep:modality-datastore", "dep:modality-node"]
passfile = ["dep:modality-common", "dep:rpassword"]
upgrade = ["dep:reqwest", "dep:self-replace", "dep:serde"]
cli-contract = ["dep:modality-common", "dep:modality-cli-contract"]
cli-ai = ["dep:modality-cli-ai"]
contract-onboarding = [
  "identity",
  "passfile",
  "cli-contract",
  "cli-ai",
  "modality-cli-contract/model-status",
]
full = [
  "contract-onboarding",
  "upgrade",
  "modality-cli-contract/full",
  "dep:modality-cli-chain",
  "dep:modality-cli-hub",
  "dep:modality-cli-net",
  "dep:modality-cli-node",
  "dep:modality-cli-predicate",
  "dep:modality-cli-program",
  "modality-cli-program/full",
]
